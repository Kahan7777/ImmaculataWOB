<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/main2.css')}}">
    <title>War Of Bureaucracy</title>
</head>
<body>
    <img src="{{ url_for('static', filename='images/topBundle.svg')}}" class="wide" alt="Bring">
    <!--<div class="immaculataWrapper">
        <img src="/templates/images/immacBorder2.svg" alt="Border" class="immacBorder">
        <img src="/templates/images/immacBg.svg" alt="" class="immacBg">
    </div>-->
    <div class="doublewrap">
        <div class="questionareWrapper">
            <div class="warOfBur">
                <p>War of Bureaucracy</p>
            </div>
            <div class="formWrapper">
                <form action="#" method="post">
                    <div class="form-container">    
                        <select name="schoolNameDropdown" required>
                            <option value="" disabled selected> School Name</option>
                            <option value="Campion">Campion</option>
                            <option value="Cathederal">Cathederal</option>
                            <option value="St_Annes">St.Annes</option>
                            <option value="J_B_Petit">J.B. Petit</option>
                            <option value="Queen_Marys_School">Queen Marys</option>
                            <option value="Villa_Theresa_School"> Villa Theresa School</option>
                            <option value="Activity_High">Activity High School</option>
                            <option value="Bright_Start_Fellowship">Bright Start Fellowship High School</option>
                            <option value="Bai_Avabai_Petit">Bai Avabai Petit</option>
                            <option value="Christ_Church_School">Christ Church School</option>
                            <option value="Diamond_Jubilee_School">Diamond Jubilee High School</option>
                            <option value="G_D_Somani">GD Somani</option>
                            <option value="Greenlawns">Greenlawns</option>
                            <option value="J_B_Vachha">J.B. Vachha</option>
                            <option value="St_Many's_SSC">St. Mary's High School SSC</option>
                            <option value="St_Xavier's_High">St. Xavier's High School</option>

                        </select>
                    </div>
                    <div class="form-container">
                        <p><input type="number" name="schoolPassword" placeholder="School Password"/></p>
                    </div>
                    <div class="form-container">
                        <select name="typeOfOrder" required>
                            <option value="" disabled selected>Buy Order or Sell Order</option>
                            <option value="1">Buy Order</option>
                            <option value="2">Sell Order</option>
                        </select>
                    </div>
                    <div class="form-container">
                        <select name="stock" required>
                            <option value="" disabled selected>Name of Stock</option>
                            <option value="Burrmanfabrics">Burrmanfabrics</option>
                            <option value="NPCTech">NPCTech</option>
                            <option value="GENOFoods">GENOFoods</option>
                            <option value="GoliathBanks">GoliathBanks</option>
                            <option value="NatFuels">NatFuels</option>
                            <option value="WrightAirlines">WrightAirlines</option>
                            <option value="aquaFortis">aquaFortis</option>
                            <option value="buildScape">buildScape</option>
                            <option value="healthQuest">healthQuest</option>
                            <option value="ignitedMinds">ignitedMinds</option>
                            <option value="prasiddhiAutos">prasiddhiAutos</option>
                        </select>
                    </div>
                    <div class="form-container">
                        <p><input type="number" name="noOfStocks" placeholder="Number of Stocks"/>

                        </p>
                    </div>
                    <input type="submit" value="Submit">
                    <div class="links">
                        <a href="{{ url_for('stocks')}}" class="clickabled">Look At Stocks</a>    
                    </div>
                </form>
            </div>
        </div>
    </div>
    <img src="{{ url_for('static', filename='images/bottomSvg.svg')}}" alt="Nf" class="wide2">
    <div class="circle200"></div>
    <div class="circle400"></div>
    <div class="circle100"></div>
</body>
</html>
